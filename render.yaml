services:
  - type: web
    name: tecnoforms-flow
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/Loren07-kie/ENTR-ML
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tecnoforms-history
          property: connectionString
      - key: STORAGE_NOTICE
        value: 'Base gratuita de demostración: vence el 6 de diciembre de 2026. Descarga tus copias desde Mis formularios.'
